[project]
name = "autopsych"
version = "0.1.0"
description = "A preregistration-ready measurement stack for machine-psychology experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "openrouter>=0.9.1",
    "pandas>=3.0.2",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
]

[project.scripts]
autopsych = "autopsych.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopsych"]

[tool.pytest.ini_options]
testpaths = ["tests"]
